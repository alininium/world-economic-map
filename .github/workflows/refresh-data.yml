name: Refresh data

# Runs the data pipeline on a GitHub runner (which can reach the public data APIs) and opens a
# pull request with the regenerated files in data/. Start it from the Actions tab.
#
# Two jobs: `build` installs dependencies and runs the pipeline with a read-only token;
# `publish` holds the write token but runs no third-party code, only git and gh.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Pipeline steps or groups, space-separated (empty = all, e.g. "macro resources")'
        required: false
        default: ''

concurrency: refresh-data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      status: ${{ steps.pipeline.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run the pipeline
        id: pipeline
        env:
          STEPS: ${{ inputs.steps }}
          # Optional: add a COMTRADE_API_KEY repository secret to include trade data.
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: |
          # Step names are letters and spaces only; the input is never interpolated or echoed.
          if ! [[ "$STEPS" =~ ^[a-z\ ]*$ ]]; then echo "Invalid steps input."; exit 1; fi
          set +e
          npm run data:refresh -- $STEPS 2>&1 | tee pipeline.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # The data PR is opened with the workflow token, which does not trigger the CI workflow,
      # so the same checks run here, plus a sanity check over every dataset.
      - run: npm run data:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-data
          path: |
            data
            !data/**/*.new
            pipeline.log
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace data/ with the refreshed files
        run: rm -rf data
      - uses: actions/download-artifact@v4
        with:
          name: refreshed-data
          path: .

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ needs.build.outputs.status }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then echo "No data changes."; exit 0; fi
          branch="data-refresh/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A data
          git commit -m "Refresh data (pipeline exit status ${STATUS})"
          git push -u origin "$branch"
          {
            echo "Data regenerated by the **Refresh data** workflow (run ${GITHUB_RUN_ID})."
            echo
            if [ "$STATUS" != "0" ]; then
              echo "⚠️ The pipeline exited with status ${STATUS}: some steps failed (see the log)."
              echo "Their previous files were left in place where the step failed before writing;"
              echo "review the diff of those steps' files before merging."
            else
              echo "All steps succeeded. data:check, lint, tests and build passed in the run."
            fi
            echo
            echo '```'
            tail -n 60 pipeline.log
            echo '```'
          } > body.md
          if ! out=$(gh pr create --base "$BASE" --head "$branch" \
              --title "Refresh data (run ${GITHUB_RUN_ID})" --body-file body.md 2>&1); then
            echo "$out"
            if grep -qi "not permitted to create" <<<"$out"; then
              echo "::warning::Actions may not open PRs in this repository; branch $branch was pushed."
            else
              exit 1
            fi
          fi

      - name: Fail the run if the pipeline failed
        if: needs.build.outputs.status != '0'
        env:
          STATUS: ${{ needs.build.outputs.status }}
        run: |
          echo "::error::The pipeline exited with status $STATUS; see the build job log."
          exit 1
