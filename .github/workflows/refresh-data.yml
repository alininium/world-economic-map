name: Refresh data

# Runs the data pipeline on a GitHub runner (which can reach the public data APIs) and opens a
# pull request with the regenerated files in data/. Start it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Pipeline steps or groups, space-separated (empty = all, e.g. "macro resources")'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run the pipeline
        id: pipeline
        env:
          STEPS: ${{ inputs.steps }}
          # Optional: add a COMTRADE_API_KEY repository secret to include trade data.
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: |
          # Only step names (letters) and spaces; never interpolate the input into the script.
          if ! [[ "$STEPS" =~ ^[a-z\ ]*$ ]]; then echo "Invalid steps: $STEPS"; exit 1; fi
          set +e
          npm run data:refresh -- $STEPS 2>&1 | tee pipeline.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Check the regenerated data
        run: npm test

      - name: Open a pull request with the new data
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.pipeline.outputs.status }}
        run: |
          if git diff --quiet -- data; then echo "No data changes."; exit 0; fi
          branch="data-refresh/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data
          git commit -m "Refresh data (pipeline exit status ${STATUS})"
          git push -u origin "$branch"
          {
            echo "Data regenerated by the **Refresh data** workflow (run ${GITHUB_RUN_ID})."
            echo
            echo "Pipeline exit status: ${STATUS} (non-zero means some steps failed; their old files were kept)."
            echo
            echo '```'
            tail -n 60 pipeline.log
            echo '```'
          } > body.md
          # Creating PRs from Actions must be allowed in the repository settings; if it is not,
          # the branch is still pushed and the PR can be opened by hand.
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "Refresh data (run ${GITHUB_RUN_ID})" --body-file body.md \
            || echo "::warning::Could not open the PR automatically; branch $branch was pushed."
